async function unzip(file){

 let e=b.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
 const n=v.getUint16(e+10,true);let o=v.getUint32(e+16,true);const out=[];
 for(let i=0;i<n;i++){
  if(v.getUint32(o,true)!==0x02014b50)break;
  const m=v.getUint16(o+10,true),cs=v.getUint32(o+20,true),nl=v.getUint16(o+28,true),el=v.getUint16(o+30,true),cl=v.getUint16(o+32,true),lo=v.getUint32(o+42,true),name=td.decode(b.subarray(o+46,o+46+nl));
  o+=46+nl+el+cl;
  if(name.endsWith('/'))continue;
  const data=async()=>{const ln=v.getUint16(lo+26,true),le=v.getUint16(lo+28,true),s=lo+30+ln+le,raw=b.subarray(s,s+cs);if(m===0)return raw;if(m!==8)throw new Error('zip method');const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(ds).arrayBuffer())};
  out.push({p:name,text:async()=>td.decode(await data()),blob:async()=>new Blob([await data()])});

function obs(txt,folder){
 let tags=[];txt=txt.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
 const fm=txt.match(/^---\n([\s\S]*?)\n---\n?/);
 if(fm){txt=txt.slice(fm[0].length);const L=fm[1].split('\n'),i=L.findIndex(l=>/^tags?\s*:/i.test(l));
  if(i>=0){const v=L[i].replace(/^tags?\s*:/i,'').trim();if(v)tags=v.replace(/^\[|\]$/g,'').split(/[,\s]+/);else for(let j=i+1;j<L.length&&/^\s*-\s*/.test(L[j]);j++)tags.push(L[j].replace(/^\s*-\s*/,''))}}
 const tg=t=>t.replace(/^#/,'').replace(/["']/g,'').trim().replace(/[\/\s-]+/g,'_');
 tags=tags.map(tg).filter(Boolean);if(folder)tags.push(tg(folder));
 txt=txt.replace(/%%[\s\S]*?%%/g,'').replace(/==([^=\n]+)==/g,'$1').replace(/ \^[\w-]+$/gm,'')
  .replace(/!\[[^\]]*\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,(m,u)=>/^https?:/i.test(u)?m:'![['+base(u)+']]')
  .replace(/!\[\[([^\]|#]+?)(?:#[^\]|]*)?(?:\|[^\]]*)?\]\]/g,(m,n)=>IMG.test(n.trim())?'![['+base(n.trim())+']]':'![['+n.trim().split('/').pop().replace(/\.md$/i,'')+']]')
  
  .replace(/(?<!!)\[\[([^\]]+)\]\]/g,(m,i)=>{const [a,...al]=i.split('|');const t=a.split('#')[0].split('^')[0].trim().split('/').pop().replace(/\.md$/i,'');return t?'[['+t+(al.length?'|'+al.join('|'):'')+']]':''});
 if(tags.length)txt=txt.trimEnd()+'\n\n'+[...new Set(tags)].map(t=>'#'+t).join(' ');
 return txt.trim()}

function syncSoon(){if(!SY.ref||SY.applying)return;clearTimeout(SY.t);SY.t=setTimeout(push,1500)}
async function push(){if(!SY.ref)return;if(SY.busy){SY.dirty=1;return}SY.busy=1;setSt('busy');
